services:
  agenteval-lite:
    build:
      context: .
      dockerfile: Dockerfile
    image: agenteval-lite:local
    container_name: agenteval-lite
    ports:
      - "3000:3000"
    env_file:
      - .env.example
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    restart: unless-stopped
